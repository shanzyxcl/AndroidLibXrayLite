name: Update Xray Core

on:
  schedule:
    # Cek update setiap hari Senin jam 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Versi xray-core (kosongkan untuk latest)'
        required: false
        default: ''

jobs:
  update-xray:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get current xray-core version
        id: current_version
        run: |
          CURRENT=$(grep 'github.com/xtls/xray-core' go.mod | awk '{print $2}')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current xray-core: $CURRENT"

      - name: Update xray-core
        id: update
        run: |
          if [ -n "${{ github.event.inputs.xray_version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.xray_version }}"
            echo "Updating to specified version: $TARGET_VERSION"
            go get github.com/xtls/xray-core@$TARGET_VERSION
          else
            echo "Updating to latest version..."
            go get github.com/xtls/xray-core@latest
          fi

          # Sync semua dependency yang ikut berubah
          go mod tidy

          NEW=$(grep 'github.com/xtls/xray-core' go.mod | awk '{print $2}')
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "New xray-core: $NEW"

      - name: Check if anything changed
        id: diff
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected, xray-core already up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff go.mod
          fi

      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "Verifying build after update..."
          go build ./...
          echo "Build successful!"

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update xray-core ${{ steps.current_version.outputs.version }} → ${{ steps.update.outputs.new_version }}
          title: 'chore: update xray-core to ${{ steps.update.outputs.new_version }}'
          body: |
            ## 🔄 Xray Core Update

            | | Version |
            |---|---|
            | **Before** | `${{ steps.current_version.outputs.version }}` |
            | **After** | `${{ steps.update.outputs.new_version }}` |

            ### Perubahan
            - Update `github.com/xtls/xray-core`
            - `go mod tidy` untuk sync dependency indirect (reality, utls, quic-go, dll)

            ### Checklist
            - [x] Build berhasil
            - [ ] Test manual di device Android
            - [ ] Review changelog xray-core

            > Auto-generated by [Update Xray Core](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow
          branch: 'chore/update-xray-core'
          delete-branch: true
          labels: |
            dependencies
            xray-core
